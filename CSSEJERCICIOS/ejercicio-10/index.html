<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

<body>

    <header>
        <nav class="menu">
            <a href="#inicio">Inicio</a>
            <a href="#proyectos">Proyectos</a>
            <a href="#recursos">Recursos</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <main class="contenedor">
        <h1>Pseudoclases</h1>

        <section class="tarjeta">
            <h2>1. Formulario</h2>
            
            <form class="formulario" action="#" method="POST">
                <div class="campo">
                    <label for="usuario">Nombre de usuario:</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Escribe tu usuario...">
                </div>

                <div class="campo">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="usuario@dominio.com">
                </div>

                <button type="submit" class="btn-enviar">Enviar Datos</button>
            </form>
        </section>

        <section class="tarjeta">
            <h2>2. Lista Estructural</h2>

            <ul class="lista-elementos">
                <li>Elemento 1 </li>
                <li>Elemento 2 </li>
                <li>Elemento 3 </li>
                <li>Elemento 4 </li>
                <li>Elemento 5 </li>
                <li>Elemento 6 </li>
            </ul>
        </section>
    </main>

</body>
</html>
